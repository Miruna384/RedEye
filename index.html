    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #f0f0f0;
            overflow-x: hidden;
        }
        header {
            padding: 20px 50px;
            background: rgba(10, 10, 10, 0.9);
            border-bottom: 1px solid #ff2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #ff2a2a;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 42, 42, 0.6);
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
            background: radial-gradient(circle at top, #240505 0%, #0a0a0a 70%);
        }
        h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .highlight {
            color: #ff2a2a;
            text-shadow: 0 0 15px rgba(255, 42, 42, 0.5);
        }
        p.subtitle {
            font-size: 1.2rem;
            max-width: 700px;
            color: #bbbbbb;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .image-placeholder {
            width: 80%;
            max-width: 800px;
            height: 400px;
            background: #111;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ff2a2a;
            box-shadow: 0 0 40px rgba(255, 42, 42, 0.15);
            margin-top: 20px;
            overflow: hidden; /* Ensures the image respects the rounded corners */
        }
        .image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Keeps the aspect ratio without distorting the image */
        }
        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 60px;
            flex-wrap: wrap;
        }
        .feature-card {
            background: #141414;
            border: 1px solid #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            transition: 0.3s ease-in-out;
        }
        .feature-card:hover {
            border-color: #ff2a2a;
            box-shadow: 0 10px 20px rgba(255, 42, 42, 0.1);
            transform: translateY(-5px);
        }
        .feature-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }
        .buy-section {
            text-align: center;
            padding: 80px 20px;
            background: #111;
            border-top: 1px solid #222;
        }
        .cta-button {
            background: transparent;
            color: #ff2a2a;
            border: 2px solid #ff2a2a;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 4px;
        }
        .cta-button:hover {
            background: #ff2a2a;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 42, 42, 0.5);
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #050505;
            font-size: 0.9rem;
            color: #555;
        }
    </style>
</head>
